<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Карта 1 - Базовые линии (дороги)</title>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-family: sans-serif;
            font-size: 12px;
            z-index: 1000;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info">
        <strong>📍 Слой: planet_osm_line</strong><br>
        Отображение всех линейных объектов (дороги, реки, ж/д)
    </div>

    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />

    <script>
        const SERVER_URL = 'http://192.168.192.156:3000';

        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    'lines': {
                        type: 'vector',
                        tiles: [`${SERVER_URL}/planet_osm_line/{z}/{x}/{y}`]
                    }
                },
                layers: [
                    {
                        id: 'lines-layer',
                        type: 'line',
                        source: 'lines',
                        'source-layer': 'planet_osm_line',
                        paint: {
                            'line-color': '#ff6600',
                            'line-width': 2,
                            'line-opacity': 0.8
                        }
                    }
                ]
            },
            center: [20.5, 54.7],
            zoom: 10
        });

        map.addControl(new maplibregl.NavigationControl());
    </script>
</body>
</html>
