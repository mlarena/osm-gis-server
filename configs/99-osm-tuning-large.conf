# Настройки PostgreSQL для OSM (32GB+ RAM)
# Максимальная производительность для импорта всей страны или планеты

# Память и кэширование
shared_buffers = 8GB
effective_cache_size = 24GB
maintenance_work_mem = 4GB
work_mem = 256MB

# WAL (журналы предзаписи) — для больших импортов
max_wal_size = 32GB
min_wal_size = 4GB
checkpoint_timeout = 60min
checkpoint_completion_target = 0.9

# Оптимизации для SSD
random_page_cost = 1.1
effective_io_concurrency = 300

# Параллельная обработка
max_parallel_workers_per_gather = 4
max_parallel_workers = 12
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000.0

# Дополнительные буферы
wal_buffers = 64MB
temp_buffers = 64MB

# Оптимизации планировщика
default_statistics_target = 500
